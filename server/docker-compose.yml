version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gdansk_hub_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: coworking_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: gdansk_hub_api
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: 'postgresql://postgres:postgrespassword@postgres:5432/coworking_db?schema=public'
      JWT_SECRET: 'gdansk-hub-super-secret-jwt-key-2026'
      CORS_ORIGIN: 'http://localhost:5173'
    depends_on:
      - postgres

volumes:
  pgdata:
